name: ASP KUMAR SCHOOL HUB APK BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        run: |
          echo "Searching for Android project..."

          if find . -name settings.gradle | grep -q .; then
            echo "Project already extracted"
          else
            ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" | head -1)

            if [ -z "$ZIP" ]; then
              echo "ERROR: Android ZIP not found!"
              echo "Repository files:"
              find . -maxdepth 3 -type f
              exit 1
            fi

            echo "Found ZIP: $ZIP"
            mkdir -p project
            unzip -o "$ZIP" -d project
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: |
          SETTINGS=$(find . -name settings.gradle | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          cd "$PROJECT_DIR"

          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASP-KUMAR-SCHOOL-HUB-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
