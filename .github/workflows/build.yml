name: ASP KUMAR SCHOOL HUB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android Project ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -type f \
            -name '*BACK_HOME_DESKTOP.zip' \
            -not -path './.git/*' | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Updated ZIP not found"
            echo "Upload the BACK_HOME_DESKTOP ZIP"
            find . -maxdepth 3 -type f
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -e
          FILE=$(find extracted -name settings.gradle \
            -type f | head -1)

          if [ -z "$FILE" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FILE")
          cd "$PROJECT_DIR"

          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASP-KUMAR-SCHOOL-HUB-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
