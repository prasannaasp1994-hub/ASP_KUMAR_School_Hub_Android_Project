name: ASP KUMAR SCHOOL HUB APK BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and Extract Android Project
        run: |
          set -e
          ZIP=$(find . -type f -name '*BACK_HOME_DESKTOP.zip' | head -1)
          if [ -z "$ZIP" ]; then
            echo "Updated Android ZIP not found"
            exit 1
          fi
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          set -e
          FILE=$(find extracted -name settings.gradle -type f | head -1)

          if [ -z "$FILE" ]; then
            echo "Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FILE")
          cd "$PROJECT_DIR"

          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASP-KUMAR-SCHOOL-HUB-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
